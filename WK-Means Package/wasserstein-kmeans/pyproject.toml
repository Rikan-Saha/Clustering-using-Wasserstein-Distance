[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wasserstein-cluster"
version = "0.1.0"
description = "Enterprise-grade Wasserstein K-Means clustering for probability distributions with Scikit-Learn API compliance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Rikan Saha" }
]
keywords = [
    "optimal-transport",
    "wasserstein",
    "clustering",
    "kmeans",
    "scikit-learn",
    "machine-learning",
    "barycenter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
    "bokeh>=3.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]
all = [
    "wasserstein-cluster[viz,api,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wasserstein_cluster"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "joblib.*", "bokeh.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
